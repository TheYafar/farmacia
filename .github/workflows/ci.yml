name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farmacia
          POSTGRES_PASSWORD: farmacia
          POSTGRES_DB: farmacia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U farmacia" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://farmacia:farmacia@localhost:5432/farmacia_test
      DATABASE_URL_TEST: postgresql://farmacia:farmacia@localhost:5432/farmacia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @farmacia/shared && npm run build -w @farmacia/web
